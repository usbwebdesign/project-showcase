<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Connect 4 — Super Express (móvil)</title>
<style>
  :root{
    --bg:#0f1724;
    --panel:#0b1220;
    --accent:#06b6d4;
    --player1:#ef4444; /* rojo */
    --player2:#f59e0b; /* amarillo / naranja */
    --cell-size:calc(min(12vw, 64px)); /* responsive cell */
    --cols:7;
    --rows:6;
  }

  /* Reset básico */
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background:linear-gradient(180deg,#071024 0%, var(--bg) 100%);
    color:#e6eef6;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    -webkit-tap-highlight-color: transparent;
  }

  /* Contenedor principal */
  .c4-app{
    width:100%;
    max-width:800px;
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border-radius:14px;
    box-shadow: 0 10px 30px rgba(2,6,23,0.6);
    padding:14px;
    display:flex;
    gap:12px;
    flex-direction:column;
    align-items:center;
  }

  .c4-header{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .c4-title{
    font-weight:700;
    letter-spacing:0.2px;
    font-size:1.05rem;
  }
  .c4-controls{
    display:flex;
    gap:8px;
    align-items:center;
  }

  .c4-btn{
    background:transparent;
    border:1px solid rgba(255,255,255,0.06);
    color:inherit;
    padding:8px 10px;
    border-radius:10px;
    font-weight:600;
    font-size:0.85rem;
    backdrop-filter: blur(4px);
    cursor:pointer;
  }
  .c4-btn:active{transform:translateY(1px)}

  .c4-info{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
    gap:8px;
  }

  .c4-indicator{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:600;
  }
  .c4-indicator .dot{
    width:18px;height:18px;border-radius:50%;display:inline-block;box-shadow:0 2px 6px rgba(0,0,0,0.6)
  }

  /* Tablero: grid con columnas y filas */
  .c4-board-wrap{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    padding:10px;
    border-radius:12px;
    display:flex;
    justify-content:center;
    width:100%;
    overflow:auto;
  }

  .c4-board{
    display:grid;
    grid-template-columns: repeat(var(--cols), var(--cell-size));
    gap:8px;
    padding:10px;
    background: linear-gradient(180deg, #062036, #03202b);
    border-radius:10px;
    box-shadow: inset 0 6px 20px rgba(0,0,0,0.5);
    touch-action: manipulation;
  }

  /* Celda y ficha */
  .c4-cell{
    width:var(--cell-size);
    height:var(--cell-size);
    min-width:40px;
    min-height:40px;
    border-radius:50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.18));
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    cursor: pointer;
    transition: transform .08s ease;
    -webkit-user-select:none;
    user-select:none;
  }
  .c4-cell:active{transform:scale(0.98)}

  .c4-piece{
    width:82%;
    height:82%;
    border-radius:50%;
    background:transparent;
    box-shadow: inset 0 -6px 12px rgba(0,0,0,0.35);
    transition: transform .18s cubic-bezier(.2,.9,.2,1), background .12s linear;
    transform: translateY(-12px) scale(.98);
    opacity:0.98;
  }

  .p1{ background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.14), var(--player1) 30%); border: 2px solid rgba(0,0,0,0.35); }
  .p2{ background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.14), var(--player2) 30%); border: 2px solid rgba(0,0,0,0.35); }

  /* Cuando la pieza cae (animación rápida) */
  .drop {
    transform: translateY(0) scale(1) !important;
  }

  /* Resaltar columna al tocar */
  .c4-column-hover{
    filter:brightness(1.05) saturate(1.05);
    box-shadow: 0 6px 18px rgba(3,10,20,0.45);
    transform: translateY(-3px);
  }

  /* Mensaje ganador */
  .c4-message{
    width:100%;
    text-align:center;
    padding:8px 10px;
    border-radius:8px;
    font-weight:700;
    display:none;
  }
  .c4-message.show{ display:block; }

  /* Responsive layout tweaks */
  @media (min-width:520px){
    .c4-app{ padding:18px 20px; }
    :root{ --cell-size:calc(min(9vw, 72px)); }
  }
</style>
</head>
<body>
  <main class="c4-app" aria-live="polite">
    <div class="c4-header">
      <div class="c4-title">Connect 4 — Super Express</div>
      <div class="c4-controls">
        <button class="c4-btn" id="btn-reset" title="Reiniciar partida">Reiniciar</button>
        <button class="c4-btn" id="btn-random" title="Reiniciar y elegir quien inicia">Shuffle</button>
      </div>
    </div>

    <div class="c4-info">
      <div class="c4-indicator" id="turn-indicator">
        <span id="turn-dot" class="dot" style="background:var(--player1)"></span>
        <span id="turn-text">Turno: Jugador 1</span>
      </div>
      <div style="opacity:0.9;font-size:0.82rem">Toca la columna para soltar la ficha</div>
    </div>

    <div class="c4-board-wrap">
      <div id="c4-board" class="c4-board" role="grid" aria-label="Tablero de Connect 4"></div>
    </div>

    <div id="msg" class="c4-message"></div>
  </main>

<script>
/*
  Connect 4 — implementación rápida y móvil-friendly.
  Columnas: 7, Filas: 6
*/
(() => {
  const COLS = 7;
  const ROWS = 6;
  const boardEl = document.getElementById('c4-board');
  const turnDot = document.getElementById('turn-dot');
  const turnText = document.getElementById('turn-text');
  const msgEl = document.getElementById('msg');
  const btnReset = document.getElementById('btn-reset');
  const btnRandom = document.getElementById('btn-random');

  // Modelo del tablero: filas x columnas, 0 = vacío, 1 = jugador1, 2 = jugador2
  let board = [];
  let current = 1;
  let gameOver = false;

  // Inicializa
  function init(startPlayer = 1){
    board = Array.from({length:ROWS}, ()=> Array(COLS).fill(0));
    current = startPlayer;
    gameOver = false;
    msgEl.className = 'c4-message';
    msgEl.textContent = '';
    renderBoard();
    updateTurnUI();
  }

  // Renderiza el tablero en DOM
  function renderBoard(){
    boardEl.innerHTML = '';
    boardEl.style.setProperty('--cols', COLS);
    // Creamos celdas en orden (fila 0..rows-1, col 0..cols-1) — grid fill
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const cell = document.createElement('button');
        cell.className = 'c4-cell';
        cell.setAttribute('data-row', r);
        cell.setAttribute('data-col', c);
        cell.setAttribute('aria-label', `Celda fila ${r+1} columna ${c+1}`);
        cell.setAttribute('role','button');
        cell.addEventListener('click', onColumnClick);
        cell.addEventListener('touchstart', onColumnTouch, {passive:true});
        // ficha interna
        const piece = document.createElement('div');
        piece.className = 'c4-piece';
        const val = board[r][c];
        if (val === 1) piece.classList.add('p1','drop');
        else if (val === 2) piece.classList.add('p2','drop');
        cell.appendChild(piece);
        boardEl.appendChild(cell);
      }
    }
  }

  // Encuentra la fila más baja vacía en una columna
  function lowestEmptyRow(col){
    for(let r=ROWS-1; r>=0; r--){
      if(board[r][col] === 0) return r;
    }
    return -1;
  }

  // Manejar click/touch — se usa la columna del target
  function onColumnClick(e){
    if (gameOver) return;
    const col = Number(e.currentTarget.dataset.col);
    playInColumn(col);
  }

  function onColumnTouch(e){
    if (gameOver) return;
    // En touch, el elemento mismo es la celda tocada; usamos su columna
    const col = Number(e.currentTarget.dataset.col);
    // evitar doble ejecución en algunos navegadores; se controla por playInColumn
    playInColumn(col);
  }

  // Ejecuta movimiento en columna
  function playInColumn(col){
    const row = lowestEmptyRow(col);
    if (row === -1) {
      flashMessage('Columna llena', 700);
      return;
    }
    // Marca
    board[row][col] = current;
    // Actualiza visualmente con efecto drop
    const index = row * COLS + col;
    const cell = boardEl.children[index];
    const piece = cell.querySelector('.c4-piece');
    // aplicar clase de jugador y animación
    piece.className = 'c4-piece ' + (current === 1 ? 'p1' : 'p2');
    // fuerza reflow para animar
    requestAnimationFrame(()=> {
      piece.classList.add('drop');
    });

    // Checar ganador
    if (checkWin(row, col, current)){
      gameOver = true;
      const winnerText = current === 1 ? 'Jugador 1 (rojo) gana 🎉' : 'Jugador 2 (amarillo) gana 🎉';
      showEndMessage(winnerText);
      highlightWinningSequence(); // opcional: ya lo marcamos en checkWin
      return;
    }

    // Empate?
    if (isFull()){
      gameOver = true;
      showEndMessage('Empate — buen duelo 💥');
      return;
    }

    // Cambiar turno
    current = current === 1 ? 2 : 1;
    updateTurnUI();
  }

  function updateTurnUI(){
    turnDot.style.background = current === 1 ? getComputedStyle(document.documentElement).getPropertyValue('--player1').trim() : getComputedStyle(document.documentElement).getPropertyValue('--player2').trim();
    turnText.textContent = `Turno: Jugador ${current}`;
  }

  // Mostrar mensaje temporal
  let flashTimer = null;
  function flashMessage(text, ms=900){
    msgEl.className = 'c4-message show';
    msgEl.textContent = text;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(()=> {
      if (!gameOver){
        msgEl.className = 'c4-message';
        msgEl.textContent = '';
      }
    }, ms);
  }

  function showEndMessage(text){
    msgEl.className = 'c4-message show';
    msgEl.textContent = text;
  }

  // Comprobar empate (tablero lleno)
  function isFull(){
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(board[r][c]===0) return false;
    return true;
  }

  // Comprobar victoria: buscamos 4 en línea en 4 direcciones
  // También almacena la secuencia ganadora en winSeq
  let winSeq = [];
  function checkWin(r0, c0, player){
    winSeq = [];
    const directions = [
      {dr:0, dc:1}, // horizontal
      {dr:1, dc:0}, // vertical
      {dr:1, dc:1}, // diag \
      {dr:1, dc:-1} // diag /
    ];
    for(const {dr,dc} of directions){
      let seq = [[r0,c0]];
      // buscar hacia adelante
      for(let step=1; step<4; step++){
        const r = r0 + dr*step;
        const c = c0 + dc*step;
        if (r<0||r>=ROWS||c<0||c>=COLS) break;
        if (board[r][c] === player) seq.push([r,c]);
        else break;
      }
      // hacia atrás
      for(let step=1; step<4; step++){
        const r = r0 - dr*step;
        const c = c0 - dc*step;
        if (r<0||r>=ROWS||c<0||c>=COLS) break;
        if (board[r][c] === player) seq.unshift([r,c]);
        else break;
      }
      if (seq.length >= 4){
        winSeq = seq;
        return true;
      }
    }
    return false;
  }

  // Resaltar secuencia ganadora
  function highlightWinningSequence(){
    if (!winSeq || winSeq.length===0) return;
    // agregar efecto: para cada celda, añadir sombra y escalar
    for(const [r,c] of winSeq){
      const idx = r * COLS + c;
      const cell = boardEl.children[idx];
      const piece = cell.querySelector('.c4-piece');
      if (piece){
        piece.style.transform = 'scale(1.08)';
        piece.style.boxShadow = '0 6px 24px rgba(0,0,0,0.5), 0 0 18px rgba(255,255,255,0.06) inset';
      }
    }
  }

  // Eventos de botones
  btnReset.addEventListener('click', ()=> init(1));
  btnRandom.addEventListener('click', ()=> init(Math.random() < 0.5 ? 1 : 2));

  // Soporte: efecto visual al tocar la columna (hover mobile-ish)
  boardEl.addEventListener('pointerdown', (ev) => {
    const cell = ev.target.closest('.c4-cell');
    if (!cell) return;
    const col = Number(cell.dataset.col);
    // aplicar clase a todas las celdas de la columna
    for(let r=0;r<ROWS;r++){
      const idx = r*COLS + col;
      const colCell = boardEl.children[idx];
      if (colCell) colCell.classList.add('c4-column-hover');
    }
  });
  boardEl.addEventListener('pointerup', clearColumnHover);
  boardEl.addEventListener('pointercancel', clearColumnHover);
  boardEl.addEventListener('pointerleave', clearColumnHover);

  function clearColumnHover(){
    Array.from(boardEl.children).forEach(c => c.classList.remove('c4-column-hover'));
  }

  // Inicializar primera partida
  init(1);

  // Exponer para debugging (opcional)
  window.__c4 = { getBoard: () => board, reset: init };
})();
</script>
</body>
</html>
