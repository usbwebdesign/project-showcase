<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Profesores</title>
  <link rel="stylesheet" href="./styles.css">
  <!-- Aquí está el link correcto -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_back_ios_new" />
</head>
<body>
  
    <nav><img src="./img/LogoUSBMxAzul (1) (1).png" alt="logo"></nav>
  <!-- Login -->
  <div id="loginPage" class="card">
    <h1 class="form-title">Portal USBOnline</h1>
    <form id="loginForm">
      <div>
        <input type="text" id="username" placeholder="Usuario" required>
      </div>
<div class="input-icon left">
  <input type="password" id="password" placeholder="Contraseña" required>
  <!-- <span class="material-symbols-outlined">lock</span> -->
</div>


      <button class="btn-form" type="submit">Iniciar sesión</button>
    </form>
  </div>

  <!-- Dashboard Profesores y Coordinadores -->
  <div id="dashboard" class="hidden">
    <h2>Profesores Activos</h2>
    <div id="profList" class="prof-list"></div>

    <h2>Coordinadores</h2>
    <div id="coordList" class="prof-list"></div>

    <button id="logoutBtn" class="logout-btn">Cerrar sesión</button>
  </div>

  <!-- Detalle Profesor/Coordinador -->
  <div id="profDetail" class="card-user hidden">
<button id="backBtn" class="back-btn">
  <span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>

    <img id="detailImg" src="" alt="Foto de perfil">
    <h2 id="detailName"></h2>
    <p class="program-title"><strong>Programa académico:</strong></p>
    <span class="program" id="detailPrograma"></span>

    <h3 class="table-title">Inicios de Sesión</h3>
    <table id="sessionTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Inicio de sesión</th>
          <th>Cierre de sesión</th>
          <th>Duración</th>
        </tr>
      </thead>
      <tbody>
        <!-- Sesiones generadas con JS -->
      </tbody>
    </table>
  </div>

  <script src="./scripts.js"></script>
</body>
</html>
